<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Search Saudi-affiliated researchers in the Stanford–Elsevier top 2% scientists database (Version 9, August 2026) and download a verifiable certificate.">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Saudi Top 2% Scientists</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Layout: one working column — masthead, tab bar (Directory / Institutions / About), then the active view; certificate + share card open in a dialog */
:root{
  --bg:#F3F6F4; --surface:#FFFFFF; --ink:#14211B; --muted:#5A6B62; --line:#D9E2DC;
  --accent:#0B6B43; --accent-ink:#FFFFFF; --accent-soft:#E2F0E8; --gold:#8F6E25; --gold-soft:#F4ECD8; --bar:#0B6B43; --bar2:#C9A85A;
  --shadow:0 1px 2px rgba(20,33,27,.06),0 8px 24px rgba(20,33,27,.06);
  --page:linear-gradient(165deg,#007A3D 0%,#006C35 28%,#0B4F33 62%,#06301F 100%);
  --on:#F2F8F4; --on-muted:#C3DCCD; --on-line:rgba(255,255,255,.22); --on-gold:#E6CC80;
  --f-ui:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --f-display:"Cormorant Garamond","Times New Roman",Georgia,serif;
  --f-ar-display:"Amiri","Traditional Arabic","Times New Roman",serif;
  --f-data:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --page:linear-gradient(165deg,#00562A 0%,#0A3F28 45%,#05170F 100%); --on:#EAF3EE; --on-muted:#A9C6B5; --on-line:rgba(255,255,255,.16); --on-gold:#D9BC72;
  --bg:#0D1411; --surface:#141E19; --ink:#E4EDE8; --muted:#93A69B; --line:#25332C;
  --accent:#43B784; --accent-ink:#06130D; --accent-soft:#16301F; --gold:#D4B46C; --gold-soft:#2A2414; --bar:#43B784; --bar2:#B8964E;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --page:linear-gradient(165deg,#00562A 0%,#0A3F28 45%,#05170F 100%); --on:#EAF3EE; --on-muted:#A9C6B5; --on-line:rgba(255,255,255,.16); --on-gold:#D9BC72;
  --bg:#0D1411; --surface:#141E19; --ink:#E4EDE8; --muted:#93A69B; --line:#25332C;
  --accent:#43B784; --accent-ink:#06130D; --accent-soft:#16301F; --gold:#D4B46C; --gold-soft:#2A2414; --bar:#43B784; --bar2:#B8964E;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
body{background:#006C35;background:var(--page);background-attachment:fixed;min-height:100%;color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.55}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:28px 64px}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}

/* masthead */
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--on-gold);font-weight:600}
[dir="rtl"] .eyebrow{letter-spacing:0}
h1{color:var(--on);font-family:var(--f-display);font-weight:600;font-size:clamp(30px,5vw,46px);line-height:1.05;margin:6px 0 6px;text-wrap:balance}
[dir="rtl"] h1{font-family:var(--f-ar-display);font-weight:700;line-height:1.3}
.lede{color:var(--on-muted);max-width:62ch;margin:0}
.mast{display:flex;gap:16px;align-items:flex-start;min-width:0}
.flag{width:60px;height:40px;flex:none;border-radius:3px;box-shadow:0 0 0 1px var(--on-line),0 4px 14px rgba(0,0,0,.25);margin-top:4px;display:block}
@media (max-width:520px){.mast{flex-direction:column;gap:10px}}
.langbtn{border:1px solid var(--on-line);background:var(--surface);border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:600}
.langbtn:hover{border-color:var(--accent)}
.stats{display:flex;flex-wrap:wrap;gap:8px 28px;margin:22px 0 0;padding:14px 0;border-top:1px solid var(--on-line);color:var(--on)}
.stat b{display:block;font-family:var(--f-data);font-weight:500;font-size:22px;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--on-muted)}

/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--on-line);margin:0 0 22px;overflow-x:auto}
.tab{appearance:none;border:none;background:none;padding:12px 14px;cursor:pointer;color:var(--on-muted);font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--on);border-bottom-color:var(--on-gold)}
.tab:hover{color:var(--on)}

/* search */
.search{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow);display:grid;gap:10px}
#q{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:13px 14px;font-size:17px}
#q:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.filters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.filters label{display:grid;gap:4px;font-size:12px;color:var(--muted);min-width:0}
.filters select{width:100%;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px}
@media (max-width:680px){.filters{grid-template-columns:1fr}}
.meta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:18px 2px 8px;color:var(--on-muted);font-size:13px}

/* results */
.list{display:grid;gap:8px}
.row{display:grid;grid-template-columns:86px minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;text-align:start;width:100%}
.row:hover{border-color:var(--accent)}
.rk{font-family:var(--f-data);font-variant-numeric:tabular-nums;font-size:15px}
.rk small{display:block;font-family:var(--f-ui);font-size:11px;color:var(--muted)}
.who{min-width:0}
.nm{font-weight:600;font-size:16px;overflow-wrap:anywhere}
.sub{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.tags{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tag{font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;white-space:nowrap}
.tag.c{background:var(--accent-soft);color:var(--accent)}
.tag.s{background:var(--gold-soft);color:var(--gold)}
@media (max-width:560px){.row{grid-template-columns:64px minmax(0,1fr)}.tags{grid-column:2;justify-content:flex-start}}
.more{margin:14px auto 0;display:block;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 20px;cursor:pointer}
.empty{padding:28px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:12px}

/* institutions */
.h2{font-size:20px;margin:0 0 4px;color:var(--on)}
.intro{color:var(--on-muted);margin:0 0 16px;max-width:70ch}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--on-muted);margin-bottom:12px}
.legend i{box-shadow:0 0 0 1px var(--on-line);display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-inline-end:6px}
.league{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.irow{display:grid;grid-template-columns:36px minmax(0,1.3fr) minmax(0,1fr) 64px;gap:12px;align-items:center;padding:10px 14px;border-top:1px solid var(--line);width:100%;background:none;border-inline:none;border-bottom:none;text-align:start;cursor:pointer}
.irow:first-child{border-top:none}
.irow:hover{background:var(--accent-soft)}
.ipos{font-family:var(--f-data);color:var(--muted);font-variant-numeric:tabular-nums}
.iname{font-weight:600;min-width:0;overflow-wrap:anywhere}
.ibar{display:flex;height:14px;border-radius:4px;overflow:hidden;background:var(--bg);min-width:0}
.ibar span:first-child{background:var(--bar)}
.ibar span:last-child{background:var(--bar2)}
.inum{font-family:var(--f-data);text-align:end;font-variant-numeric:tabular-nums}
.inum small{display:block;font-family:var(--f-ui);font-size:11px;color:var(--muted)}
@media (max-width:620px){.irow{grid-template-columns:28px minmax(0,1fr) 56px}.ibar{grid-column:2;grid-row:2}}

/* about */
.about{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:20px;align-items:start}
@media (max-width:820px){.about{grid-template-columns:1fr}}
.dev{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;box-shadow:var(--shadow)}
.devhead{display:flex;flex-direction:column;gap:14px}
.devphoto{width:128px;height:128px;border-radius:50%;background:var(--accent-soft) center/cover no-repeat;box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--gold);display:flex;align-items:center;justify-content:center;font-family:var(--f-display);font-size:44px;font-weight:700;color:var(--accent)}
.dev .role{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);font-weight:600}
[dir="rtl"] .dev .role{letter-spacing:0}
.dev h2{font-family:var(--f-display);font-size:32px;line-height:1.1;margin:8px 0 2px}
[dir="rtl"] .dev h2{font-family:var(--f-ar-display);font-size:30px;line-height:1.4}
.dev .alt{color:var(--muted);margin:0 0 14px}
.dev ul{margin:0;padding-inline-start:18px;display:grid;gap:6px}
.dev .tags{justify-content:flex-start;margin-top:14px}
.prose{max-width:none;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:22px 24px;box-shadow:var(--shadow)}
footer a{color:var(--on-gold)}
.prose h3{font-size:16px;margin:22px 0 6px}
.prose h3:first-child{margin-top:0}
.prose p,.prose li{color:var(--ink)}
.prose dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0}
.prose dt{font-family:var(--f-data);font-size:13px;color:var(--accent)}
.prose dd{margin:0}
footer{margin-top:40px;padding-top:16px;border-top:1px solid var(--on-line);font-size:13px;color:var(--on-muted);display:grid;gap:8px}

/* dialog */
dialog{border:none;padding:0;border-radius:16px;background:var(--surface);color:var(--ink);width:min(980px,calc(100vw - 24px));max-height:calc(100vh - 24px);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(8,14,11,.55)}
.dlg{display:grid;gap:16px;padding:18px}
.dhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.dhead h2{margin:0;font-size:20px;overflow-wrap:anywhere}
.x{border:1px solid var(--line);background:transparent;border-radius:8px;width:36px;height:36px;cursor:pointer;flex:none;font-size:18px}
.seg{display:flex;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px;width:max-content;max-width:100%}
.seg button{border:none;background:none;border-radius:7px;padding:6px 12px;cursor:pointer;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.pv{width:100%;overflow:hidden;border-radius:6px;border:1px solid var(--line);background:#fff}
.pv>div{transform-origin:top left}
[dir="rtl"] .pv>div{transform-origin:top left}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.fact{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.fact h3{margin:0 0 6px;font-size:12px;color:var(--muted);font-weight:600}
.fact dl{margin:0;display:grid;grid-template-columns:auto auto;gap:2px 10px;font-size:13px}
.fact dd{margin:0;text-align:end;font-family:var(--f-data);font-variant-numeric:tabular-nums}
.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.primary{background:var(--accent);color:var(--accent-ink);border:none;border-radius:10px;padding:11px 18px;font-weight:600;cursor:pointer}
.secondary{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 16px;font-weight:600;cursor:pointer}
.secondary:hover{border-color:var(--accent)}
.primary[disabled],.secondary[disabled]{opacity:.6;cursor:progress}
.photorow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.upl{display:inline-flex;align-items:center;gap:8px;font-size:14px}
.link{border:none;background:none;color:var(--accent);cursor:pointer;font-weight:600;padding:4px}
.status{font-size:13px;color:var(--muted)}
.linkbox{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;font-family:var(--f-data);font-size:12px}
.note{font-size:12px;color:var(--muted);margin:0}
.hl{animation:hl 2.4s ease-out}
@keyframes hl{from{box-shadow:0 0 0 4px var(--gold)}to{box-shadow:0 0 0 4px transparent}}

/* certificate: a fixed printed object with its own colors in both themes */
.cert{width:1123px;height:794px;position:relative;background:#FFFFFF;color:#1B2620;font-family:var(--f-ui);direction:ltr;overflow:hidden}
.cert .frame{position:absolute;inset:22px;border:2px solid #0B5D3B}
.cert .frame2{position:absolute;inset:30px;border:1px solid #B08D3C}
.cert .corner{position:absolute;width:64px;height:64px;border-color:#B08D3C;border-style:solid}
.cert .c1{top:38px;left:38px;border-width:3px 0 0 3px}.cert .c2{top:38px;right:38px;border-width:3px 3px 0 0}
.cert .c3{bottom:38px;left:38px;border-width:0 0 3px 3px}.cert .c4{bottom:38px;right:38px;border-width:0 3px 3px 0}
.cert .inner{position:absolute;inset:58px 78px 50px;display:flex;flex-direction:column;align-items:center;text-align:center}
.cert .issuer{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;width:100%;font-size:13px;color:#0B5D3B;font-weight:600}
.cert .issuer span{flex:1;text-align:left}.cert .issuer span.ar{text-align:right}
.cert .cflag{width:54px;height:36px;flex:none;border:1px solid #D9E2DC;margin-top:-6px}
.cert .issuer .ar{font-family:var(--f-ar-display);font-size:17px;font-weight:700}
.cert .t-en{font-family:var(--f-display);font-size:50px;font-weight:600;color:#0B5D3B;line-height:1;margin-top:10px}
.cert .t-ar{font-family:var(--f-ar-display);font-size:30px;color:#B08D3C;line-height:1.3;margin-top:2px}
.cert .lead{font-family:var(--f-display);font-style:italic;font-size:20px;color:#4A564F;margin-top:6px}
.cert .name{font-family:var(--f-display);font-size:48px;font-weight:700;color:#14211B;line-height:1.1;margin-top:2px;max-width:900px}
.cert .namerow{display:flex;align-items:center;gap:22px;margin-top:4px}
.cert .cphoto{width:96px;height:96px;border-radius:50%;background:#EEF2EF center/cover no-repeat;border:3px solid #B08D3C;flex:none}
.cert .rule{width:360px;height:1px;background:#B08D3C;margin:8px 0 8px}
.cert .aff{font-size:17px;font-weight:600;color:#0B5D3B;max-width:900px}
.cert .body{font-size:14.5px;line-height:1.55;color:#33413A;max-width:860px;margin-top:8px}
.cert .field{font-size:14px;margin-top:8px;color:#1B2620}
.cert .field b{color:#0B5D3B}
.cert .boxes{display:flex;gap:18px;justify-content:center;margin-top:14px;width:100%}
.cert .box{flex:0 1 400px;border:1px solid #CDBB8E;background:#FBF8F0;border-radius:6px;padding:10px 16px;text-align:left}
.cert .box h4{margin:0 0 6px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#8A6A22}
.cert .box .big{font-family:var(--f-data);font-size:26px;font-weight:500;color:#0B5D3B;line-height:1.1}
.cert .box .big small{font-family:var(--f-ui);font-size:12px;color:#5A6B62;font-weight:400;margin-left:6px}
.cert .box .ln{font-size:12.5px;color:#33413A;margin-top:4px}
.cert .foot{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end;width:100%;font-size:11px;color:#5A6B62;text-align:left;gap:20px}
.cert .qr{display:flex;align-items:flex-end;gap:10px;flex:none}
.cert .qr img{width:84px;height:84px;image-rendering:pixelated;display:block}
.cert .qr div{font-size:10px;line-height:1.35;max-width:110px;color:#5A6B62}
.cert .seal{width:84px;height:84px;border-radius:50%;border:2px solid #B08D3C;display:flex;align-items:center;justify-content:center;flex:none;color:#0B5D3B;font-family:var(--f-display);font-weight:700;font-size:22px;line-height:1;text-align:center}
.cert .seal span{display:block;font-size:10px;font-family:var(--f-ui);font-weight:600;letter-spacing:.06em;color:#8A6A22}
.cert .disc{max-width:600px}

/* share card: 1200x630 social image */
.card{width:1200px;height:630px;position:relative;background:#0B4F33;color:#F4F1E6;font-family:var(--f-ui);direction:ltr;overflow:hidden;display:grid;grid-template-columns:1fr 300px}
.card .pat{position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.035) 0 2px,transparent 2px 22px)}
.card .l{position:relative;padding:56px 0 50px 64px;display:flex;flex-direction:column}
.card .eb{font-size:17px;letter-spacing:.14em;text-transform:uppercase;color:#D9BC72;font-weight:600}
.card .ar{align-self:flex-start;font-family:var(--f-ar-display);font-size:28px;color:#D9BC72;margin-top:2px;line-height:1.4}
.card .nm{font-family:var(--f-display);font-size:66px;font-weight:700;line-height:1.02;margin-top:26px;color:#FFFFFF;max-width:780px}
.card .in{font-size:23px;margin-top:14px;color:#CFE3D6;max-width:780px}
.card .kphoto{position:absolute;right:56px;top:150px;width:210px;height:210px;border-radius:50%;background:#0F5E3D center/cover no-repeat;border:5px solid #D9BC72}
.card .nums{display:flex;gap:44px;margin-top:auto}
.card .num b{display:block;font-family:var(--f-data);font-weight:500;font-size:46px;color:#FFFFFF;line-height:1}
.card .num span{font-size:15px;color:#BFD6C8}
.card .r{position:relative;background:#F4F1E6;color:#0B4F33;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:30px;text-align:center}
.card .r .big{font-family:var(--f-display);font-size:96px;font-weight:700;line-height:.9}
.card .r .cap{font-size:16px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:#8A6A22}
.card .r img{width:132px;height:132px;image-rendering:pixelated}
.card .r small{font-size:13px;color:#4A5A50;line-height:1.4}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap" id="app">

const RAW = JSON.parse(document.getElementById('data').textContent);
const F = RAW.fields;
const toObj = r => Object.fromEntries(F.map((f,i)=>[f,r[i]]));
const $ = id => document.getElementById(id);
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm = s => (s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9؀-ۿ]+/g,' ').trim();
const displayName = n => { const i=n.indexOf(', '); return i<0 ? n : n.slice(i+2)+' '+n.slice(0,i); };
const asciiName = s => s.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9]+/g,'_').replace(/^_|_$/g,'');

/* merge both lists into people (key = name + institution) */
const people = new Map();
for (const [key,list] of [['career',RAW.career],['single',RAW.single]]) for (const r of list) {
  const o = toObj(r), k = o.name+'|'+o.inst;
  if (!people.has(k)) people.set(k,{key:k,name:o.name,inst:o.inst,field:o.field,sub1:o.sub1});
  people.get(k)[key] = o;
}
function recordId(k){ let h=2166136261; for (const ch of k+'v9'){ h^=ch.charCodeAt(0); h=Math.imul(h,16777619)>>>0; } return 'SA-V9-'+h.toString(36).toUpperCase().padStart(7,'0'); }
const P = [...people.values()].map(p => {
  p.best = Math.min(p.career?.rank ?? Infinity, p.single?.rank ?? Infinity);
  p.display = displayName(p.name); p.idx = norm(p.name+' '+p.display); p.id = recordId(p.key);
  const pcts = [p.career,p.single].filter(Boolean).map(r=>r.srank/r.scount*100); p.bestPct = Math.min(...pcts);
  return p;
}).sort((a,b)=>a.best-b.best);
const byId = new Map(P.map(p=>[p.id,p]));

let lang='en'; try{ if(localStorage.getItem('lang')==='ar') lang='ar'; }catch(e){}
const t = k => T[lang][k];
const fieldName = f => lang==='ar' ? (FIELD_AR[f]||f) : f;
const fmt = n => n==null ? '—' : Number(n).toLocaleString('en');
const loc = n => Number(n).toLocaleString(lang==='ar'?'ar-SA':'en');
const pctTxt = v => v < 0.01 ? '<0.01%' : v.toFixed(2)+'%';
const pct = r => pctTxt(r.srank/r.scount*100);

/* ---- record links + QR ---- */
function siteBase(){
  if (SITE.baseUrl) return SITE.baseUrl.replace(/#.*$/,'');
  if (/^https?:$/.test(location.protocol) && !window.claude) return location.origin + location.pathname;
  return '';
}
const recordUrl = p => siteBase() ? siteBase() + '#' + p.id : '';
function qrData(text){
  if (!text || typeof qrcode !== 'function') return '';
  const q = qrcode(0,'M'); q.addData(text); q.make(); return q.createDataURL(6, 2);
}

/* ---- views ---- */
const VIEWS = ['directory','institutions','about'];
function show(v){
  VIEWS.forEach(x => { $('v-'+x).hidden = x!==v; $('t-'+x).setAttribute('aria-selected', x===v); });
}
document.querySelector('.tabs').addEventListener('click', e => { const b=e.target.closest('.tab'); if(b){ location.hash = b.dataset.v; } });
function route(){
  const h = decodeURIComponent(location.hash.slice(1));
  if (byId.has(h)) { show('directory'); openPerson(byId.get(h)); return; }
  show(VIEWS.includes(h) ? h : 'directory');
}
window.addEventListener('hashchange', route);

/* ---- directory ---- */
const insts = [...new Set(P.map(p=>p.inst))].sort((a,b)=>a.localeCompare(b));
const fields = [...new Set(P.map(p=>p.field))].sort();
function fillSelects(){
  const keep = {l:$('fList').value, i:$('fInst').value, f:$('fField').value};
  $('fList').innerHTML = [['',t('all')],['career',t('lCareer')],['single',t('lSingle')],['both',t('lBoth')]].map(([v,l])=>`<option value="${v}">${l}</option>`).join('');
  $('fInst').innerHTML = `<option value="">${t('allInst')}</option>` + insts.map(i=>`<option>${esc(i)}</option>`).join('');
  $('fField').innerHTML = `<option value="">${t('allField')}</option>` + fields.map(f=>`<option value="${esc(f)}">${esc(fieldName(f))}</option>`).join('');
  $('fList').value=keep.l||''; $('fInst').value=keep.i||''; $('fField').value=keep.f||'';
}
let shown=40, results=P;
function filter(){
  const toks = norm($('q').value).split(' ').filter(Boolean);
  const L=$('fList').value, I=$('fInst').value, Fd=$('fField').value;
  results = P.filter(p => (!L || (L==='career'?p.career:L==='single'?p.single:(p.career&&p.single))) && (!I||p.inst===I) && (!Fd||p.field===Fd) && toks.every(tk=>p.idx.includes(tk)));
  shown=40; render();
}
function render(){
  $('count').textContent = t('count')(results.length);
  if (!results.length){ $('list').innerHTML = `<div class="empty">${t('none')}</div>`; $('more').hidden=true; return; }
  $('list').innerHTML = results.slice(0,shown).map(p=>`
    <button class="row" type="button" data-id="${p.id}">
      <div class="rk">#${fmt(p.best)}<small>${t('world')}</small></div>
      <div class="who"><div class="nm">${esc(p.display)}</div><div class="sub">${esc(p.inst)} · ${esc(fieldName(p.field))}</div></div>
      <div class="tags">${p.career?`<span class="tag c">${t('lCareer')}</span>`:''}${p.single?`<span class="tag s">${t('lSingle')}</span>`:''}</div>
    </button>`).join('');
  $('more').hidden = results.length<=shown; $('more').textContent = t('more');
}
$('q').addEventListener('input', filter);
['fList','fInst','fField'].forEach(id=>$(id).addEventListener('change',filter));
$('more').onclick = () => { shown+=40; render(); };
$('list').addEventListener('click', e => { const b=e.target.closest('.row'); if(b) location.hash = b.dataset.id; });

/* ---- institutions league ---- */
const league = (() => {
  const m = new Map();
  for (const p of P){ const o = m.get(p.inst) || {inst:p.inst,n:0,career:0,single:0,singleOnly:0}; o.n++; if(p.career) o.career++; if(p.single) o.single++; if(!p.career) o.singleOnly++; m.set(p.inst,o); }
  return [...m.values()].sort((a,b)=>b.n-a.n || b.career-a.career || a.inst.localeCompare(b.inst));
})();
let instShown = 25;
function renderLeague(){
  const max = league[0].n;
  $('instIntro').textContent = t('instIntro')(league.length, league[0]);
  $('league').innerHTML = league.slice(0,instShown).map((o,i)=>`
    <button class="irow" type="button" data-inst="${esc(o.inst)}" aria-label="${esc(o.inst)}: ${o.n}">
      <span class="ipos">${i+1}</span>
      <span class="iname">${esc(o.inst)}</span>
      <span class="ibar"><span style="width:${o.career/max*100}%"></span><span style="width:${o.singleOnly/max*100}%"></span></span>
      <span class="inum">${loc(o.n)}<small>${lang==='ar'?'':''}${loc(o.career)} · ${loc(o.single)}</small></span>
    </button>`).join('');
  $('instMore').hidden = instShown >= league.length; $('instMore').textContent = t('showAll')(league.length);
}
$('instMore').onclick = () => { instShown = league.length; renderLeague(); };
$('league').addEventListener('click', e => {
  const b = e.target.closest('.irow'); if(!b) return;
  $('q').value=''; $('fList').value=''; $('fField').value=''; $('fInst').value = b.dataset.inst; filter();
  location.hash = 'directory'; window.scrollTo({top: $('v-directory').offsetTop - 20});
});

/* ---- about ---- */
function renderAbout(){
  const d = SITE.developer;
  $('devName').textContent = lang==='ar' ? d.nameAr : d.nameEn;
  const ph=$('devPhoto'); if (d.photo){ ph.style.backgroundImage=`url("${d.photo}")`; ph.textContent=''; ph.setAttribute('role','img'); ph.setAttribute('aria-label', d.nameEn); } else { ph.textContent='SA'; }
  $('devAlt').textContent = lang==='ar' ? d.nameEn : d.nameAr;
  $('devList').innerHTML = (lang==='ar'?d.ar:d.en).map(x=>`<li>${esc(x)}</li>`).join('');
  $('devTags').innerHTML = (lang==='ar'?d.tagsAr:d.tagsEn).map(x=>`<span class="tag c">${esc(x)}</span>`).join('');
  $('aboutProse').innerHTML = t('about');
  $('credit').innerHTML = t('credit');
}

/* ---- certificate + share card ---- */
function box(title, r, yearLabel){
  return `<div class="box"><h4>${title}</h4>
    <div class="big">#${fmt(r.rank)}<small>world rank by composite c-score</small></div>
    <div class="ln">Rank ${fmt(r.srank)} of ${fmt(r.scount)} in ${esc(r.sub1)} &nbsp;·&nbsp; top ${pct(r)}</div>
    <div class="ln">h-index ${fmt(r.h)} &nbsp;·&nbsp; ${fmt(r.cites)} citations ${yearLabel}</div></div>`;
}
function certHTML(p){
  const issued = new Date().toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});
  const which = p.career&&p.single ? 'both the career-long and the single-year (2025) rankings' : p.career ? 'the career-long ranking' : 'the single-year (2025) ranking';
  const url = recordUrl(p), qr = qrData(url);
  return `<div class="cert">
   <div class="frame"></div><div class="frame2"></div>

function cardHTML(p){
  const r = p.career && (!p.single || p.career.rank <= p.single.rank) ? p.career : p.single;
  const listLbl = r===p.career ? 'Career-long' : '2025';
  const qr = qrData(recordUrl(p));
  return `<div class="card"><div class="pat"></div>
    <div class="l">
      <div class="eb">World’s top-cited scientists · 2026</div>
      <div class="ar" dir="rtl">ضمن قائمة أفضل 2% من العلماء في العالم</div>
      ${photoOf(p) ? `<div class="kphoto" style="background-image:url('${photoOf(p)}')"></div>` : ''}
      <div class="nm"${photoOf(p)?' style="max-width:560px"':''}>${esc(p.display)}</div>
      <div class="in">${esc(p.inst)}, Saudi Arabia</div>
      <div class="nums">
        <div class="num"><b>#${fmt(r.rank)}</b><span>World rank · ${listLbl}</span></div>
        <div class="num"><b>Top ${pctTxt(p.bestPct)}</b><span>in ${esc(p.sub1)}</span></div>
      </div>
    </div>
    <div class="r">
      <div class="cap">Stanford–Elsevier list</div>
      <div class="big">Top<br>2%</div>
      ${qr ? `<img src="${qr}" alt=""><small>Scan to verify<br>${p.id}</small>` : `<small>Version 9 · August 2026<br>${p.id}</small>`}
    </div></div>`;
}
function facts(p){
  const blk = (title,r) => `<div class="fact"><h3>${title}</h3><dl>
    <dt>${t('fRank')}</dt><dd>#${fmt(r.rank)}</dd><dt>${t('fRankNs')}</dt><dd>#${fmt(r.rank_ns)}</dd>
    <dt>${t('fSub')}</dt><dd>${fmt(r.srank)} / ${fmt(r.scount)}</dd><dt>${t('fTop')}</dt><dd>${pct(r)}</dd>
    <dt>${t('fH')}</dt><dd>${fmt(r.h)}</dd><dt>${t('fCites')}</dt><dd>${fmt(r.cites)}</dd>
    <dt>${t('fPapers')}</dt><dd>${fmt(r.papers)}</dd><dt>${t('fSelf')}</dt><dd>${(r.self*100).toFixed(1)}%</dd></dl></div>`;
  return (p.career?blk(t('lCareer'),p.career):'') + (p.single?blk(t('lSingle'),p.single):'');
}
let current=null, mode='cert';
/* researcher photos stay in this browser tab only: never uploaded or stored */
const photos = new Map();
const photoOf = p => photos.get(p.id) || '';
function loadPhoto(file){
  return new Promise((res,rej)=>{
    if(!/^image\/(jpeg|png|webp)$/.test(file.type)) return rej('type');
    if(file.size > 15*1024*1024) return rej('size');
    const img=new Image(), url=URL.createObjectURL(file);
    img.onload=()=>{ const s=Math.min(img.width,img.height), c=document.createElement('canvas'); c.width=c.height=Math.min(600,s);
      c.getContext('2d').drawImage(img,(img.width-s)/2,(img.height-s)/2,s,s,0,0,c.width,c.height);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg',0.9)); };
    img.onerror=()=>{ URL.revokeObjectURL(url); rej('read'); };
    img.src=url;
  });
}
const DIM = {cert:[1123,794], card:[1200,630]};
function fitPreview(){
  const pv=$('pv'), c=pv.firstElementChild; if(!c) return;
  const [w,h] = DIM[mode], s = pv.clientWidth/w; c.style.transform=`scale(${s})`; pv.style.height=(h*s)+'px';
}
new ResizeObserver(fitPreview).observe($('pv'));
function drawPreview(){ if(!current) return; $('photoRm').hidden=!photoOf(current); $('pv').innerHTML = mode==='cert' ? certHTML(current) : cardHTML(current); $('sCert').setAttribute('aria-pressed',mode==='cert'); $('sCard').setAttribute('aria-pressed',mode==='card'); fitPreview(); }
function openPerson(p, keep){
  current=p; $('dName').textContent=p.display; $('facts').innerHTML=facts(p); $('status').textContent=''; $('linkbox').hidden=true;
  drawPreview();
  if(!keep && !$('dlg').open) $('dlg').showModal();
  fitPreview();
}
$('photoIn').addEventListener('change', async e=>{
  const f=e.target.files[0]; e.target.value=''; if(!f||!current) return;
  try{ photos.set(current.id, await loadPhoto(f)); $('status').textContent=''; drawPreview(); }
  catch(err){ $('status').textContent = t('photoBad'); }
});
$('photoBtn').onclick=()=>$('photoIn').click();
$('photoRm').onclick=()=>{ if(current){ photos.delete(current.id); drawPreview(); } };
$('sCert').onclick=()=>{mode='cert';drawPreview();};
$('sCard').onclick=()=>{mode='card';drawPreview();};
$('close').onclick=()=>$('dlg').close();
$('dlg').addEventListener('click', e=>{ if(e.target===$('dlg')) $('dlg').close(); });
$('dlg').addEventListener('close', ()=>{
  const p=current; current=null;
  if (byId.has(decodeURIComponent(location.hash.slice(1)))) history.replaceState(null,'','#directory');
  const row = p && document.querySelector(`.row[data-id="${p.id}"]`); if(row){ row.focus(); }
});

async function render2canvas(html,w,h){
  const host=document.createElement('div');
  host.style.cssText=`position:fixed;left:-30000px;top:0;width:${w}px;height:${h}px`;
  host.innerHTML=html; document.body.appendChild(host);
  try{ await document.fonts.ready; return await html2canvas(host.firstElementChild,{scale:2,backgroundColor:null,logging:false}); }
  finally{ host.remove(); }
}
async function offer(filename, blob){
  const cap = window.claude?.use ? await window.claude.use('downloads') : null;
  if (cap){
    try{ await cap.save({filename,data:blob}); return t('saved'); }
    catch(err){ return err?.code==='declined' ? t('declined') : t('unavailable'); }
  }
  if (window.claude?.use) return t('unavailable');
  const url=URL.createObjectURL(blob), a=document.createElement('a'); a.href=url; a.download=filename;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),4000); return t('saved');
}
async function busy(btn, fn){
  btn.disabled=true; $('status').textContent=t('making');
  try{ $('status').textContent = await fn(); } catch(e){ console.error(e); $('status').textContent=t('failed'); } finally{ btn.disabled=false; }
}
$('dl').onclick = () => current && busy($('dl'), async () => {
  const p=current, canvas=await render2canvas(certHTML(p),1123,794);
  const pdf=new window.jspdf.jsPDF({orientation:'landscape',unit:'mm',format:'a4'});
  pdf.setProperties({title:'Certificate - '+p.display, subject:'Top-cited scientists, Version 9 (August 2026) - '+p.id});
  pdf.addImage(canvas.toDataURL('image/jpeg',0.95),'JPEG',0,0,297,210);
  if (recordUrl(p)) pdf.link(8,175,32,32,{url:recordUrl(p)});
  return offer(`Certificate_${asciiName(p.display)}_Top2pct_2026.pdf`, pdf.output('blob'));
});
$('dlJpg').onclick = () => current && busy($('dlJpg'), async () => {
  const p=current, canvas=await render2canvas(certHTML(p),1123,794);
  const out=document.createElement('canvas'); out.width=canvas.width; out.height=canvas.height;
  const ctx=out.getContext('2d'); ctx.fillStyle='#FFFFFF'; ctx.fillRect(0,0,out.width,out.height); ctx.drawImage(canvas,0,0);
  const blob=await new Promise(r=>out.toBlob(r,'image/jpeg',0.92));
  return offer(`Certificate_${asciiName(p.display)}_Top2pct_2026.jpg`, blob);
});
$('dlCard').onclick = () => current && busy($('dlCard'), async () => {
  const p=current, canvas=await render2canvas(cardHTML(p),1200,630);
  const blob=await new Promise(r=>canvas.toBlob(r,'image/png'));
  return offer(`Top2pct_2026_${asciiName(p.display)}.png`, blob);
});
$('copy').onclick = async () => {
  if(!current) return; const url=recordUrl(current);
  if(!url){ $('status').textContent=t('noLink'); return; }
  try{ await navigator.clipboard.writeText(url); $('status').textContent=t('copied'); }
  catch(e){ const lb=$('linkbox'); lb.hidden=false; lb.value=url; lb.select(); $('status').textContent=t('copyFail'); }
};

/* ---- language apply ---- */
function applyLang(){
  document.documentElement.lang=lang; document.documentElement.dir=t('dir');
  document.querySelectorAll('[data-i]').forEach(el=>{ const v=t(el.dataset.i); if(typeof v==='string') el.innerHTML=v; });
  $('lang').textContent=t('other'); $('q').placeholder=t('ph');
  $('dl').textContent=t('dl'); $('dlJpg').textContent=t('dlJpg'); $('dlCard').textContent=t('dlCard'); $('copy').textContent=t('copy');
  const nC=P.filter(p=>p.career).length, nS=P.filter(p=>p.single).length;
  $('stats').innerHTML=[[P.length,t('sResearchers')],[nC,t('sCareer')],[nS,t('sSingle')],[league.length,t('sInst')]]
    .map(([v,l])=>`<div class="stat"><b>${loc(v)}</b><span>${l}</span></div>`).join('');
  fillSelects(); render(); renderLeague(); renderAbout();
  if(current) openPerson(current,true);
}
$('lang').onclick=()=>{ lang=lang==='en'?'ar':'en'; try{localStorage.setItem('lang',lang)}catch(e){} applyLang(); };

applyLang(); route();
